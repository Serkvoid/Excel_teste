const DQ=[
["Qual fórmula calcula o total de B2:B50?",["=MÉDIA(B2:B50)","=SOMA(B2:B50)","=CONT.NÚM(B2:B50)","=MÁXIMO(B2:B50)"],1,"SOMA adiciona todos os valores do intervalo.","Fórmulas básicas",0],
["Você digitou =A1*B1 em C1 e arrastou até C5. Como fica C5?",["=A1*B1","=A5*B5","=A5*B1","=A1*B5"],1,"Referências relativas se ajustam ao copiar.","Referências",0],
["Para fixar coluna e linha ao copiar uma fórmula, usa-se:",["A1","$A$1","A$1","$A1"],1,"$A$1 é referência absoluta (trava coluna e linha).","Referências",0],

["Qual recurso destaca automaticamente células com valor acima de 100?",["Formatação condicional","Congelar painéis","Validação de dados","Localizar"],0,"A formatação condicional aplica formatos por regra.","Formatação",0],
["Para ordenar uma lista do menor para o maior valor, use:",["Classificar","Mesclar","Proteger","Quebrar texto"],0,"Classificar reordena os dados.","Dados",0],
["Para exibir só as linhas de uma região específica, use:",["Filtro","Classificar","Proteger planilha","Quebrar texto"],0,"O Filtro oculta as linhas que não atendem ao critério.","Dados",0],
["Qual função conta quantas células de A1:A20 contêm números?",["=CONT.NÚM(A1:A20)","=SOMA(A1:A20)","=MÉDIA(A1:A20)","=MÁXIMO(A1:A20)"],0,"CONT.NÚM conta células numéricas.","Fórmulas básicas",0],
["Qual formato exibe 0,15 como 15%?",["Porcentagem","Data","Texto","Científico"],0,"O formato Porcentagem multiplica por 100 e adiciona %.","Formatação",0],

["Somar vendas (coluna B) só do vendedor escrito em D1 (nomes na coluna A):",["=SOMA(A:B)","=SOMASE(A:A;D1;B:B)","=CONT.SE(A:A;D1)","=SE(A:A=D1;B:B)"],1,"SOMASE soma B onde A atende ao critério.","Funções condicionais",1],
["Contar pedidos que atendam dois critérios (D1 em A e E1 em B):",["=CONT.SE(A:A;D1)","=CONT.SES(A:A;D1;B:B;E1)","=SOMASES(B:B;A:A;D1)","=SE(A:A=D1;1)"],1,"CONT.SES aceita vários critérios.","Funções condicionais",1],

["Qual função retorna um valor se a condição for verdadeira e outro se for falsa?",["SE","SOMASE","ÍNDICE","ÚNICO"],0,"A função SE faz testes lógicos.","Funções condicionais",1],
["Qual a principal vantagem do PROCX sobre o PROCV?",["Busca em qualquer direção, sem depender da 1ª coluna","É mais antigo","Só funciona com texto","Exige ordenação"],0,"PROCX procura e retorna em colunas independentes.","Funções de busca",1],
["Resumir vendas por região e mês sem escrever fórmulas. Melhor ferramenta?",["Validação de dados","Tabela dinâmica","Localizar e substituir","Congelar painéis"],1,"Tabelas dinâmicas resumem dados rapidamente.","Tabelas dinâmicas",1],
["Qual gráfico é mais indicado para mostrar a evolução mensal das vendas?",["Pizza","Linhas","Rosca","Radar de 1 ponto"],1,"Gráficos de linhas mostram tendência no tempo.","Gráficos",1],
["Qual função trata erros como #DIV/0! exibindo um valor alternativo?",["SEERRO","SOMASE","PROCX","CORRESP"],0,"SEERRO substitui o erro por outro resultado.","Tratamento de erros",1],
["Qual função extrai os 3 primeiros caracteres de A1?",["=ESQUERDA(A1;3)","=DIREITA(A1;3)","=LIMPAR(A1;3)","=NÚM.CARACT(A1)"],0,"ESQUERDA retorna os primeiros caracteres.","Funções de texto",1],
["Qual função retorna a data de hoje, atualizada automaticamente?",["=HOJE()","=DIA(A1)","=MÊS(A1)","=DATA(1;1;1)"],0,"HOJE() devolve a data atual.","Funções de data",1],
["Qual combinação busca um valor à esquerda da coluna de busca (sem PROCX)?",["ÍNDICE + CORRESP","PROCV","SOMASE","SE"],0,"ÍNDICE+CORRESP não depende da posição das colunas.","Funções de busca",2],
["Qual função dinâmica devolve só as linhas que atendem a um critério?",["FILTRO","PROCV","CONT.SE","CORRESP"],0,"FILTRO retorna um intervalo dinâmico filtrado.","Funções dinâmicas",2],
["Qual função devolve uma lista sem valores repetidos?",["ÚNICO","CLASSIFICAR","SOMA","ARRUMAR"],0,"ÚNICO remove duplicatas dinamicamente.","Funções dinâmicas",2],
["O que faz =CLASSIFICAR(A2:B20;2;-1)?",["Ordena pela 2ª coluna, decrescente","Ordena pela 1ª coluna, crescente","Filtra a coluna 2","Soma as colunas"],0,"Argumentos: intervalo, coluna de índice e ordem (-1 = decrescente).","Funções dinâmicas",2],
["Qual a finalidade da função LET?",["Nomear valores/cálculos dentro da fórmula","Travar células","Criar gráficos","Importar dados"],0,"LET atribui nomes a cálculos, simplificando fórmulas.","Funções dinâmicas",2],
["Importar vários CSVs mensais, padronizar colunas e atualizar com um clique:",["Power Query","Formatação condicional","Atingir meta","Classificar"],0,"Power Query cria etapas de transformação repetíveis.","Power Query",2],
["Qual recurso filtra visualmente tabelas dinâmicas e gráficos em um dashboard?",["Segmentação de dados","Proteger planilha","Macros","Validação"],0,"Segmentações dão filtros clicáveis ao dashboard.","Dashboards",2],
["Qual recurso grava ações para repeti-las automaticamente?",["Gravador de macros","Atingir meta","Solver","Verificação de erros"],0,"O gravador de macros gera código VBA.","Automação",2],
["Qual linguagem é usada para programar macros no Excel?",["VBA","SQL","HTML","PHP"],0,"Macros são escritas em VBA.","Automação",2],
["Em uma tabela dinâmica, um campo calculado serve para:",["Criar cálculo novo a partir de campos existentes","Trocar a fonte","Formatar cores","Filtrar linhas"],0,"Campos calculados fazem contas entre campos.","Tabelas dinâmicas",2]
].map(a=>({e:a[0],a:a[1],c:a[2],x:a[3],k:a[4],n:a[5],p:a[5]+1}));
const DF=[[0,0],[30,5],[50,10],[65,15],[75,20],[85,25],[95,30]];
const defM=()=>({nome:"Padrão",qs:cl(DQ),qtd:[10,10,10],desc:{on:true,max:30,faixas:cl(DF)}});
const SV=[
["int","Depois de conhecer a proposta, você teria interesse em participar de um Intensivão de Excel?","1",["🔥 Sim, tenho muito interesse","👍 Sim, gostaria de saber mais","🤔 Talvez","❌ Não tenho interesse no momento"]],
["mot","O que mais faria você ter interesse em participar?","n",["Aprender Excel mais rapidamente","Melhorar meu desempenho no trabalho","Melhorar meu currículo","Conseguir uma oportunidade de emprego","Aprender Excel do zero","Aprofundar meus conhecimentos","Aprender análise de dados","Aprender a criar dashboards","Aprender ferramentas avançadas","Outro"]],
["cont","Quais conteúdos você teria mais interesse em aprender?","n",["Excel básico","Fórmulas","Função SE","PROCV/PROCX","Tabelas Dinâmicas","Gráficos","Dashboards","Análise de dados","Power Query","Macros","Automação","Excel aplicado ao trabalho","Outro"]],
["com","Você teria interesse em participar de uma comunidade de Excel?","1",["🔥 Sim, com certeza","👍 Sim, teria interesse","🤔 Talvez","❌ Não tenho interesse"]],
["plat","Qual plataforma você preferiria para essa comunidade?","1",["WhatsApp","Discord","Telegram","Outra","Não tenho interesse"]],
["comc","O que gostaria de encontrar nessa comunidade?","n",["Tirar dúvidas","Enviar arquivos de Excel","Receber ajuda em problemas","Dicas de Excel","Exercícios","Desafios","Aulas rápidas","Materiais","Conteúdos de análise de dados","Conversar com outros alunos"]],
["per","Qual período seria melhor para você?","n",["Manhã","Tarde","Noite","Sábado","Domingo"]],
["hor","Quais horários você teria disponibilidade?","n",["08h–10h","10h–12h","13h–15h","15h–17h","18h–20h","20h–22h"]],
["fmt","Qual formato você prefere?","1",["Presencial","Online ao vivo","Híbrido","Tanto faz"]]];
const PG=[[0,1,2],[3,4,5],[6,7,8]],PT=["Intensivão de Excel","Comunidade de Excel","Qual horário funcionaria melhor para você?"];
let cfg={ativo:"p",m:{p:defM()}},db=null,adm=false,S=lj("nv2")||{v:"home"},W=null,E={},rows=[],F={q:"",n:"",i:"",h:"",d:false,o:"data",r:-1};
const M=()=>cfg.m[cfg.ativo];
const api=async(u,o={})=>{const r=await fetch(u,{credentials:"same-origin",...o,headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):void 0});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||("Erro "+r.status));return j};
const who=()=>{$("#who").textContent=adm?"Administrador · sair":""};
$("#who").onclick=()=>adm&&api("/api/logout",{method:"POST"}).then(()=>{adm=false;who();go("home")});
api("/api/me").then(r=>{adm=r.adm;who()}).catch(()=>{});
function ask(m,inp){return new Promise(r=>{const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9";d.innerHTML=`<div class="card" style="max-width:420px;margin:0"><p>${esc(m)}</p>${inp===true?'<input id="aq">':""}<div class="f"><button class="g" id="an">${inp===0?"Fechar":"Cancelar"}</button>${inp===0?"":'<button id="ay">OK</button>'}</div></div>`;document.body.append(d);const e=x=>{d.remove();r(x)};$("#an").onclick=()=>e(inp===true?null:false);if($("#ay"))$("#ay").onclick=()=>e(inp===true?$("#aq").value:true)})}
const go=v=>{S.v=v;sj("nv2",S);render()};
const render=()=>({home,nome,quiz,sv,result,admin,edit}[S.v]||home)($("#app"));
function home(a){W=null;a.innerHTML=`<div class="card"><h1>TESTE DE NIVELAMENTO DE EXCEL</h1><p><b>Descubra seu nível de conhecimento em Excel e veja as condições especiais que você pode conquistar para participar do nosso Intensivão de Excel.</b></p><p class="mu">Este teste foi desenvolvido para identificar seus conhecimentos atuais em Excel e entender quais conteúdos você gostaria de aprender ou aperfeiçoar.</p></div><div class="hb"><button onclick="go('nome')"><span>📝</span>1 · Iniciar teste<br><small>COMEÇAR TESTE</small></button><button onclick="go('admin')"><span>📊</span>2 · Painel do admin<br><small>Resultados e gráficos</small></button><button onclick="go('edit')"><span>⚙️</span>3 · Editar formulário<br><small>Perguntas, modelos e descontos</small></button></div>${S.qs&&!S.fim?'<p><button class="g" onclick="go(\'quiz\')">Continuar teste em andamento</button></p>':""}`}
function nome(a){a.innerHTML=`<div class="card"><h2>Digite seu nome:</h2><input id="n" value="${esc(S.nome)}" maxlength="80" placeholder="Seu nome"><p class="mu">Coletamos somente seu nome. Os dados são usados para avaliação e planejamento do Intensivão de Excel (LGPD).</p><p id="er" style="color:var(--er)"></p><button onclick="ini()">COMEÇAR</button></div>`}
function pick(m){const o=[];[0,1,2].forEach(n=>o.push(...m.qs.filter(q=>q.n===n).sort(()=>Math.random()-.5).slice(0,m.qtd[n])));return o.map(q=>{const ix=q.a.map((_,i)=>i).sort(()=>Math.random()-.5);return{...q,a:ix.map(i=>q.a[i]),c:ix.indexOf(q.c)}})}
function ini(){const n=$("#n").value.trim();if(n.length<2)return $("#er").textContent="Digite seu nome.";const q=pick(M());if(!q.length)return $("#er").textContent="Formulário sem perguntas.";S={v:"quiz",nome:n,qs:q,ans:{},i:0,t0:Date.now(),sv:{},pg:0,modelo:M().nome};sj("nv2",S);render()}
function quiz(a){if(!S.qs)return go("home");const q=S.qs[S.i],n=S.qs.length,d=Object.keys(S.ans).length;a.innerHTML=`<div class="card"><div class="mu">Questão ${S.i+1} de ${n} · ${Math.round((S.i+1)/n*100)}%</div><div class="bar" style="margin:8px 0 16px"><i style="width:${(S.i+1)/n*100}%"></i></div><h2>${esc(q.e)}</h2>${q.a.map((o,j)=>`<label class="opt ${S.ans[S.i]===j?"s":""}"><input type="radio" name="r" ${S.ans[S.i]===j?"checked":""} onchange="S.ans[S.i]=${j};sj('nv2',S);quiz($('#app'))">${esc(o)}</label>`).join("")}<div class="bt"><button class="g" ${S.i?"":"disabled"} onclick="S.i--;sj('nv2',S);quiz($('#app'))">Voltar</button>${S.i<n-1?`<button onclick="S.i++;sj('nv2',S);quiz($('#app'))">Próxima</button>`:`<button onclick="fq()">Finalizar</button>`}</div><p class="mu">${d}/${n} respondidas · progresso salvo</p></div>`}
async function fq(){if(Object.keys(S.ans).length<S.qs.length&&!await ask("Você ainda possui questões não respondidas. Deseja realmente finalizar?"))return;S.pg=0;go("sv")}
function sv(a){const pg=PG[S.pg];a.innerHTML=`<div class="card"><div class="mu">${S.pg==0?"AGORA QUEREMOS SABER UM POUCO MAIS SOBRE O QUE VOCÊ PROCURA · ":""}Etapa ${S.pg+1} de 3 (não altera sua nota)</div><h2>${PT[S.pg]}</h2>${S.pg==1?'<p class="mu">Estamos estudando a possibilidade de criar uma comunidade onde pessoas interessadas em Excel possam tirar dúvidas, compartilhar conhecimentos, enviar problemas para resolver, receber dicas e conversar com outras pessoas que também estudam Excel.</p>':""}${pg.map(i=>{const[k,l,t,o]=SV[i];return`<div style="margin:16px 0"><b>${l}</b>${o.map((x,j)=>{const on=t=="1"?S.sv[k]===x:(S.sv[k]||[]).includes(x);return`<label class="opt ${on?"s":""}"><input type="${t=="1"?"radio":"checkbox"}" ${on?"checked":""} onchange="pk(${i},${j})">${esc(x)}</label>`}).join("")}</div>`}).join("")}<div class="bt"><button class="g" ${S.pg?"":"disabled"} onclick="S.pg--;sv($('#app'))">Voltar</button><button onclick="${S.pg<2?"S.pg++;sv($('#app'));scrollTo(0,0)":"fin()"}">${S.pg<2?"Próxima":"Ver meu resultado"}</button></div></div>`}
function pk(i,j){const[k,,t,o]=SV[i],x=o[j];if(t=="1")S.sv[k]=x;else{const s=new Set(S.sv[k]||[]);s.has(x)?s.delete(x):s.add(x);S.sv[k]=[...s]}sj("nv2",S);sv($("#app"))}
function dsc(p,d){if(!d.on)return 0;let v=0;for(const[mn,pc]of[...d.faixas].sort((a,b)=>a[0]-b[0]))if(p>=mn)v=pc;return Math.min(v,d.max,90)}
function calc(){const t=[0,0,0],o=[0,0,0],comp={};let cer=0;S.qs.forEach((q,i)=>{const ok=S.ans[i]===q.c;t[q.n]+=q.p;const c=comp[q.k]??=[0,0];c[1]+=q.p;if(ok){o[q.n]+=q.p;c[0]+=q.p;cer++}});const pts=o[0]+o[1]+o[2],max=t[0]+t[1]+t[2],pct=max?Math.round(pts/max*100):0,pn=[0,1,2].map(n=>t[n]?Math.round(o[n]/t[n]*100):0);
const lv=pct>=90&&pn[2]>=80?3:pct>=70&&pn[2]>=50?2:pct>=40&&(pn[1]>=40||pn[2]>=30)?1:0;const cp={};for(const k in comp)cp[k]=Math.round(comp[k][0]/comp[k][1]*100);
return{pts,max,pct,pn,nivel:NV[lv],cer,err:S.qs.length-cer,comp:cp,desc:dsc(pct,cfg.m[cfg.ativo].desc)}}
async function fin(){if(!S.res){S.res=calc();const r=S.res,rec={nome:S.nome,data:new Date().toISOString(),modelo:S.modelo,pts:r.pts,max:r.max,pct:r.pct,nivel:r.nivel,cer:r.cer,err:r.err,pn:r.pn,comp:r.comp,desc:r.desc,seg:Math.round((Date.now()-S.t0)/1000),...S.sv};try{await api("/api/resultados",{method:"POST",body:rec})}catch(e){r.sem=1}}S.fim=1;go("result")}
function result(a){const r=S.res;if(!r)return go("home");a.innerHTML=`<div class="card"><h2>RESULTADO DO SEU TESTE</h2><b>${esc(S.nome.split(" ")[0])}, seu resultado foi:</b><div class="lvl">Nível: ${r.nivel.toUpperCase()}</div><p><b>Pontuação: ${r.pts} pontos</b> · <b>Aproveitamento: ${r.pct}%</b></p><div class="grid"><div class="kpi"><b>${r.cer}</b>acertos</div><div class="kpi"><b>${r.err}</b>erros</div>${["Básico","Intermediário","Avançado"].map((n,i)=>`<div class="kpi"><b>${r.pn[i]}%</b>${n}</div>`).join("")}</div></div>
<div class="card"><h2>Desempenho por competência</h2>${Object.entries(r.comp).map(([c,v])=>`<div class="row"><span>${esc(c)}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join("")}</div>
${cfg.m[cfg.ativo].desc.on?`<div class="card" style="text-align:center"><h2>CONDIÇÃO ESPECIAL</h2><p>Com base no seu desempenho neste teste, você conquistou uma condição especial de:</p><div class="big">${r.desc}% DE DESCONTO</div><p class="mu">Essa condição é baseada exclusivamente no seu desempenho no teste.</p></div>`:""}
<div class="card"><h2>Análise personalizada (IA)</h2><button id="ia" onclick="ia()">Gerar análise</button><div id="ia2" class="mu" style="white-space:pre-wrap;margin-top:8px"></div></div>${r.sem?'<p class="mu">Não foi possível registrar seu resultado agora, mas o resultado acima está correto.</p>':""}<button class="g" onclick="S={v:'home'};sj('nv2',S);render()">Voltar ao início</button>`}
async function ia(){const r=S.res;$("#ia").disabled=true;try{const t=await api("/api/analise",{method:"POST",body:{nivel:r.nivel,pct:r.pct,pn:r.pn,comp:r.comp}});$("#ia2").textContent=t.texto}catch(e){$("#ia2").textContent="Análise indisponível no momento.";$("#ia").disabled=false}}
/* ---------- ADMIN ---------- */
const FL=[["nivel","Nível"],["int","Interesse no Intensivão"],["com","Comunidade"],["plat","Plataforma"],["fmt","Formato"],["per","Período"],["hor","Horário"],["descl","Desconto"]];
const val=(r,k)=>k=="descl"?[r.desc+"%"]:[].concat(r[k]??[]);
const gate=a=>{if(!adm){a.innerHTML='<div class="card"><h2>Acesso do administrador</h2><input id="pw" type="password" placeholder="Senha" onkeydown="if(event.key===\'Enter\')lg()"><p id="er" style="color:var(--er)"></p><div class="f"><button onclick="lg()">Entrar</button><button class="g" onclick="go(\'home\')">Voltar</button></div></div>';return 1}};
async function lg(){try{await api("/api/login",{method:"POST",body:{senha:$("#pw").value}});adm=true;who();render()}catch(e){$("#er").textContent=e.message}}
async function admin(a){if(gate(a))return;a.innerHTML='<div class="card">Carregando…</div>';try{rows=await api("/api/admin/resultados")}catch(e){adm=false;who();return render()}draw()}
const cnt=(k)=>{const c={};rows.forEach(r=>val(r,k).forEach(v=>c[v]=(c[v]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])};
const bars=(e,t)=>{const m=Math.max(1,...e.map(x=>x[1]));return`<div class="card"><h2>${t}</h2>${e.length?e.map(([l,v])=>`<div class="row"><span>${esc(l)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join(""):'<span class="mu">Sem dados</span>'}</div>`};
const sim=r=>String(r.int||"").includes("Sim");
function draw(){const a=$("#app"),n=rows.length,av=k=>n?Math.round(rows.reduce((s,r)=>s+(r[k]||0),0)/n):0,L=filt(),cp={};rows.forEach(r=>Object.entries(r.comp||{}).forEach(([c,v])=>(cp[c]??=[]).push(v)));
a.innerHTML=`<div class="grid"><div class="kpi"><b>${n}</b>testes</div><div class="kpi"><b>${new Set(rows.map(r=>r.nome.toLowerCase())).size}</b>alunos</div><div class="kpi"><b>${av("pts")}</b>média de pontos</div><div class="kpi"><b>${av("pct")}%</b>média de aproveit.</div>${NV.map(x=>`<div class="kpi"><b>${rows.filter(r=>r.nivel===x).length}</b>${x}</div>`).join("")}<div class="kpi"><b>${rows.filter(sim).length}</b>interessados no Intensivão</div><div class="kpi"><b>${rows.filter(r=>String(r.com||"").includes("Sim")).length}</b>interessados na comunidade</div></div><br>
${bars(cnt("nivel"),"Distribuição por nível")}${bars(cnt("int"),"Interesse no Intensivão")}${bars(cnt("com"),"Interesse na comunidade")}${bars(cnt("plat"),"Plataforma preferida")}${bars(cnt("hor"),"Horários preferidos")}${bars(cnt("per"),"Períodos")}${bars(cnt("fmt"),"Formato preferido")}${bars(cnt("cont").slice(0,8),"Conteúdos mais desejados")}${bars(Object.entries(cp).map(([c,v])=>[c,Math.round(v.reduce((x,y)=>x+y,0)/v.length)]).sort((x,y)=>y[1]-x[1]),"Média de aproveitamento por competência (%)")}${bars(cnt("descl"),"Descontos conquistados")}
<div class="card"><h2>Cruzamento de dados</h2><div class="f"><label>Linhas<select id="x1">${FL.map(([k,l])=>`<option value="${k}" ${E.x1==k?"selected":""}>${l}</option>`).join("")}</select></label><label>Colunas<select id="x2">${FL.map(([k,l])=>`<option value="${k}" ${(E.x2||"int")==k?"selected":""}>${l}</option>`).join("")}</select></label></div><div class="tw" id="xt"></div></div>
<div class="card"><h2>Participantes</h2><div class="f"><input id="fq" placeholder="Buscar nome" value="${esc(F.q)}"><select id="fn"><option value="">Nível</option>${NV.map(x=>`<option ${F.n==x?"selected":""}>${x}</option>`).join("")}</select><select id="fi"><option value="">Interesse</option>${SV[0][3].map(x=>`<option ${F.i==x?"selected":""}>${x}</option>`).join("")}</select><select id="fh"><option value="">Horário</option>${SV[7][3].map(x=>`<option ${F.h==x?"selected":""}>${x}</option>`).join("")}</select><label style="flex:0"><input id="fd" type="checkbox" ${F.d?"checked":""}>com desconto</label></div><div class="bt"><span class="mu">${L.length} de ${n}</span><span class="f" style="flex:0;flex-wrap:nowrap"><button class="g" onclick="delAll()">Excluir listados (${L.length})</button><button onclick="xl()">EXPORTAR PARA EXCEL (${L.length})</button></span></div><div class="tw"><table><tr>${[["nome","Nome"],["data","Data"],["pts","Pontos"],["pct","%"],["nivel","Nível"],["int","Intensivão"],["com","Comunidade"],["plat","Plataforma"],["per","Período"],["fmt","Formato"],["desc","Desc."]].map(([k,t])=>`<th onclick="srt('${k}')">${t}${F.o==k?(F.r>0?" ▲":" ▼"):""}</th>`).join("")}<th></th></tr>${L.map(r=>`<tr><td>${esc(r.nome)}</td><td>${new Date(r.data).toLocaleString("pt-BR")}</td><td>${r.pts}</td><td>${r.pct}%</td><td>${r.nivel}</td><td>${esc(r.int)}</td><td>${esc(r.com)}</td><td>${esc(r.plat)}</td><td>${esc((r.per||[]).join(", "))}</td><td>${esc(r.fmt)}</td><td>${r.desc}%</td><td><button class="g" onclick="del('${esc(r.id)}')">Excluir</button></td></tr>`).join("")}</table></div></div><button class="g" onclick="go('home')">Voltar</button>`;
const xt=()=>{E.x1=$("#x1").value;E.x2=$("#x2").value;const A=[...new Set(rows.flatMap(r=>val(r,E.x1)))],B=[...new Set(rows.flatMap(r=>val(r,E.x2)))];$("#xt").innerHTML=`<table><tr><th></th>${B.map(b=>`<th>${esc(b)}</th>`).join("")}</tr>${A.map(x=>`<tr><th>${esc(x)}</th>${B.map(b=>`<td>${rows.filter(r=>val(r,E.x1).includes(x)&&val(r,E.x2).includes(b)).length}</td>`).join("")}</tr>`).join("")}</table>`};
$("#x1").onchange=$("#x2").onchange=xt;xt();
["fq","fn","fi","fh","fd"].forEach(i=>$("#"+i).oninput=()=>{F.q=$("#fq").value;F.n=$("#fn").value;F.i=$("#fi").value;F.h=$("#fh").value;F.d=$("#fd").checked;const p=document.activeElement.id,s=document.activeElement.selectionStart;draw();const e=$("#"+p);e.focus();try{e.setSelectionRange(s,s)}catch(x){}})}
const filt=()=>rows.filter(r=>(!F.q||r.nome.toLowerCase().includes(F.q.toLowerCase()))&&(!F.n||r.nivel===F.n)&&(!F.i||r.int===F.i)&&(!F.h||(r.hor||[]).includes(F.h))&&(!F.d||r.desc>0)).sort((x,y)=>((x[F.o]??"")>(y[F.o]??"")?1:-1)*-F.r);
const srt=k=>{F.r=F.o==k?-F.r:1;F.o=k;draw()};
async function del(id){if(!await ask("Excluir este participante e seus dados? Esta ação não pode ser desfeita."))return;try{await api("/api/admin/resultados/"+id,{method:"DELETE"});rows=rows.filter(r=>r.id!==id);draw()}catch(e){ask("Não foi possível excluir: "+(e.message||e.code||"erro"),0)}}
async function delAll(){const L=filt();if(!L.length)return;if(!await ask(`Excluir ${L.length} participante(s) listado(s) agora? Esta ação não pode ser desfeita.`))return;let f=0;for(const r of L){try{await api("/api/admin/resultados/"+r.id,{method:"DELETE"});rows=rows.filter(x=>x.id!==r.id)}catch(e){f++}}draw();if(f)ask(f+" registro(s) não puderam ser excluídos.",0)}
async function xl(){const j=v=>[].concat(v??[]).join("; "),L=filt().map(r=>({Nome:r.nome,Data:new Date(r.data).toLocaleDateString("pt-BR"),Hora:new Date(r.data).toLocaleTimeString("pt-BR"),"Pontuação":r.pts,"Aproveitamento (%)":r.pct,"Nível":r.nivel,Acertos:r.cer,Erros:r.err,"Desconto (%)":r.desc,"Interesse no Intensivão":r.int,"Conteúdos de interesse":j(r.cont),"Interesse na comunidade":r.com,Plataforma:r.plat,"Períodos":j(r.per),"Horários":j(r.hor),Formato:r.fmt}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L),"Resultados");const b=new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/octet-stream"});
const u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="intensivao-excel.xlsx";l.click()}
/* ---------- EDITOR ---------- */
function edit(a){if(gate(a))return;W??=cl(cfg);const m=W.m[W.ativo],D=m.desc,ei=E.ei;
a.innerHTML=`<div class="card"><h2>Modelos de formulário</h2><div class="f"><label>Modelo (o selecionado fica ativo ao salvar)<select onchange="W.ativo=this.value;E.ei=void 0;edit($('#app'))">${Object.entries(W.m).map(([k,v])=>`<option value="${k}" ${k==W.ativo?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></label><label>Nome<input value="${esc(m.nome)}" onchange="W.m[W.ativo].nome=this.value.trim()||'Modelo'"></label></div><div class="f"><button class="g" onclick="nm()">+ Novo modelo (cópia)</button><button class="g" onclick="dm()">Excluir modelo</button><button class="g" onclick="rs()">Restaurar padrão</button><button onclick="sc()">SALVAR</button></div></div>
<div class="card"><h2>Descontos</h2><label><input type="checkbox" ${D.on?"checked":""} onchange="W.m[W.ativo].desc.on=this.checked">Ativar descontos</label><label>Desconto máximo permitido (%, até 90)<input type="number" min="0" max="90" value="${D.max}" onchange="W.m[W.ativo].desc.max=Math.max(0,Math.min(90,+this.value||0))"></label>${D.faixas.map((f,i)=>`<div class="f"><label>A partir de (%)<input type="number" value="${f[0]}" onchange="W.m[W.ativo].desc.faixas[${i}][0]=+this.value"></label><label>Desconto (%)<input type="number" value="${f[1]}" onchange="W.m[W.ativo].desc.faixas[${i}][1]=+this.value"></label><button class="g" style="flex:0" onclick="W.m[W.ativo].desc.faixas.splice(${i},1);edit($('#app'))">✕</button></div>`).join("")}<button class="g" onclick="W.m[W.ativo].desc.faixas.push([0,0]);edit($('#app'))">+ Faixa</button></div>
<div class="card"><h2>Perguntas por teste (sorteio)</h2><div class="f">${["Básicas","Intermediárias","Avançadas"].map((t,i)=>`<label>${t} (${m.qs.filter(q=>q.n==i).length} no banco)<input type="number" min="0" value="${m.qtd[i]}" onchange="W.m[W.ativo].qtd[${i}]=Math.max(0,+this.value||0)"></label>`).join("")}</div></div>
${ei!==void 0?qf(m.qs[ei]||{e:"",a:["","","",""],c:0,x:"",k:"",n:0,p:1}):""}
<div class="card"><h2>Banco de perguntas (${m.qs.length})</h2><button onclick="E.ei=-1;edit($('#app'));scrollTo(0,0)">+ Adicionar pergunta</button>${m.qs.map((q,i)=>`<div style="padding:9px 0;border-bottom:1px solid var(--bd)"><span class="tag">${["Básico","Interm.","Avançado"][q.n]} · ${q.p}pt</span><span class="tag">${esc(q.k)}</span><br>${esc(q.e)}<div class="f" style="margin-top:6px"><button class="g" style="flex:0" onclick="E.ei=${i};edit($('#app'));scrollTo(0,0)">Editar</button><button class="g" style="flex:0" onclick="W.m[W.ativo].qs.splice(${i},1);edit($('#app'))">Remover</button></div></div>`).join("")}</div><button class="g" onclick="go('home')">Voltar sem salvar</button>`}
const qf=q=>`<div class="card"><h2>${E.ei<0?"Nova pergunta":"Editar pergunta"}</h2><label>Enunciado<textarea id="qe" rows="2">${esc(q.e)}</textarea></label>${q.a.map((o,i)=>`<label>Alternativa ${i+1}<input id="qa${i}" value="${esc(o)}"></label>`).join("")}<div class="f"><label>Correta<select id="qc">${[1,2,3,4].map(i=>`<option value="${i-1}" ${q.c==i-1?"selected":""}>Alternativa ${i}</option>`).join("")}</select></label><label>Nível<select id="qn">${["Básico","Intermediário","Avançado"].map((t,i)=>`<option value="${i}" ${q.n==i?"selected":""}>${t}</option>`).join("")}</select></label><label>Pontos<input id="qp" type="number" min="1" value="${q.p}"></label></div><label>Categoria/competência<input id="qk" value="${esc(q.k)}"></label><label>Explicação<textarea id="qx" rows="2">${esc(q.x)}</textarea></label><div class="f"><button onclick="sq()">Salvar pergunta</button><button class="g" onclick="E.ei=void 0;edit($('#app'))">Cancelar</button></div></div>`;
function sq(){const q={e:$("#qe").value.trim(),a:[0,1,2,3].map(i=>$("#qa"+i).value.trim()),c:+$("#qc").value,n:+$("#qn").value,p:Math.max(1,+$("#qp").value||1),k:$("#qk").value.trim()||"Geral",x:$("#qx").value.trim()};if(!q.e||q.a.some(x=>!x))return ask("Preencha o enunciado e as 4 alternativas.",0);const m=W.m[W.ativo];E.ei<0?m.qs.push(q):m.qs[E.ei]=q;E.ei=void 0;edit($("#app"))}
async function nm(){const n=await ask("Nome do novo modelo:",true);if(!n)return;const id="m"+Date.now(),c=cl(W.m[W.ativo]);c.nome=n;W.m[id]=c;W.ativo=id;edit($("#app"))}
async function dm(){if(Object.keys(W.m).length<2)return ask("É preciso manter ao menos um modelo.",0);if(!await ask("Excluir este modelo?"))return;delete W.m[W.ativo];W.ativo=Object.keys(W.m)[0];edit($("#app"))}
async function rs(){if(!await ask("Restaurar perguntas, quantidades e descontos para o padrão inicial?"))return;const n=W.m[W.ativo].nome;W.m[W.ativo]={...defM(),nome:n};E.ei=void 0;edit($("#app"))}
async function sc(){try{await api("/api/admin/config",{method:"PUT",body:W});cfg=cl(W);ask("Formulário salvo e ativado para todos os alunos.",0)}catch(e){ask("Não foi possível salvar: "+e.message,0)}}
fetch("/api/config").then(r=>r.json()).then(c=>{if(c&&c.m&&c.m[c.ativo])cfg=c}).catch(()=>{}).finally(render);
</script></body></html>
